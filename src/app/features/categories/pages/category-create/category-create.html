<div class="mx-auto max-w-3xl p-6">

  <div class="mb-6">
    <h1 class="text-2xl font-semibold text-gray-900">
      Criar categoria
    </h1>

    <p class="mt-1 text-sm text-gray-500">
      Preencha os dados para cadastrar uma nova categoria.
    </p>
  </div>

  @if (message()) {
    <div
      class="mb-6 rounded-lg border px-4 py-3 text-sm font-medium"
      [class.border-green-200]="!isError()"
      [class.bg-green-50]="!isError()"
      [class.text-green-700]="!isError()"
      [class.border-red-200]="isError()"
      [class.bg-red-50]="isError()"
      [class.text-red-700]="isError()"
    >
      {{ message() }}
    </div>
  }

  <form
    [formGroup]="categoryForm"
    (ngSubmit)="submit()"
    class="space-y-6"
  >

    <div>
      <label
        for="name"
        class="block text-sm font-medium text-gray-700"
      >
        Nome
      </label>

      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Digite o nome da categoria"
        class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-2 text-sm outline-none focus:border-gray-500"
      />

      @if (
        categoryForm.controls.name.touched &&
        categoryForm.controls.name.invalid
      ) {
        <p class="mt-1 text-sm text-red-600">
          Informe o nome da categoria.
        </p>
      }
    </div>

    <div class="flex justify-end gap-3">

      <button
        type="button"
        (click)="cancel()"
        class="rounded-lg border border-gray-300 px-5 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
      >
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (isLoading()) {
          Criando...
        } @else {
          Criar categoria
        }
      </button>

    </div>

  </form>

</div>
