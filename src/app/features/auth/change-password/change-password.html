<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4">

    <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">

        <div class="mb-6 text-center">

            <h1 class="text-2xl font-bold text-gray-900">
                Alterar senha
            </h1>

            <p class="mt-2 text-sm text-gray-600">
                Sua senha temporária precisa ser alterada antes de continuar.
            </p>

        </div>

        @if (message()) {
        <div class="mb-4 rounded-md px-4 py-3 text-sm" [class.bg-red-100]="isError()" [class.text-red-700]="isError()"
            [class.bg-green-100]="!isError()" [class.text-green-700]="!isError()">
            {{ message() }}
        </div>
        }

        <form [formGroup]="passwordForm" (ngSubmit)="submit()" class="space-y-5">

            <div>

                <label for="newPassword" class="mb-1 block text-sm font-medium text-gray-700">
                    Nova senha
                </label>

                <input id="newPassword" type="password" formControlName="newPassword" class="w-full rounded-md border border-gray-300 px-3 py-2
                 focus:border-blue-500 focus:outline-none focus:ring-2
                 focus:ring-blue-500" />

            </div>

            <div>

                <label for="confirmPassword" class="mb-1 block text-sm font-medium text-gray-700">
                    Confirmar nova senha
                </label>

                <input id="confirmPassword" type="password" formControlName="confirmPassword" class="w-full rounded-md border border-gray-300 px-3 py-2
                 focus:border-blue-500 focus:outline-none focus:ring-2
                 focus:ring-blue-500" />

            </div>

            <button type="submit" [disabled]="isLoading()" class="w-full rounded-md
               bg-blue-600 px-4 py-2.5
               font-medium text-white
               transition
               hover:bg-blue-700
               focus:outline-none
               focus:ring-2
               focus:ring-blue-500
               focus:ring-offset-2
               disabled:cursor-not-allowed
               disabled:opacity-60">
                {{ isLoading() ? 'Alterando...' : 'Alterar senha' }}
            </button>

        </form>

    </div>

</div>
