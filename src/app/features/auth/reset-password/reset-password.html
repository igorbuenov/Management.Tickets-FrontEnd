<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4 py-8">

  <div class="w-full max-w-md">

    <!-- CARD -->
    <div class="rounded-xl bg-white p-8 shadow-lg">

      <!-- HEADER -->
      <div class="mb-8 text-center">

        <h1 class="text-2xl font-bold text-gray-900">
          Redefinir senha
        </h1>

        <p class="mt-2 text-sm text-gray-600">
          Digite sua nova senha abaixo.
        </p>

      </div>


      <!-- ERRO -->
      @if (errorMessage()) {

      <div class="mb-6 rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700">
        {{ errorMessage() }}
      </div>

      }


      <!-- SUCESSO -->
      @if (successMessage()) {

      <div class="mb-6 rounded-lg border border-green-200 bg-green-50 p-4 text-sm text-green-700">
        {{ successMessage() }}
      </div>

      }


      <!-- FORM -->
      <form (ngSubmit)="onSubmit()" class="space-y-5">

        <!-- NOVA SENHA -->
        <div>

          <label for="password" class="mb-2 block text-sm font-medium text-gray-700">
            Nova senha
          </label>

          <input id="password" name="password" type="password" [(ngModel)]="password"
            placeholder="Digite sua nova senha" autocomplete="new-password" [disabled]="isLoading()"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:bg-gray-100" />

        </div>


        <!-- CONFIRMAR SENHA -->
        <div>

          <label for="confirmPassword" class="mb-2 block text-sm font-medium text-gray-700">
            Confirmar nova senha
          </label>

          <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword"
            placeholder="Confirme sua nova senha" autocomplete="new-password" [disabled]="isLoading()"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:bg-gray-100" />

        </div>


        <!-- BOTÃO -->
        <button type="submit" [disabled]="isLoading()"
          class="w-full rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-gray-400">

          @if (isLoading()) {
          Redefinindo...
          } @else {
          Redefinir senha
          }

        </button>

      </form>


      <!-- VOLTAR -->
      <div class="mt-6 text-center">

        <a routerLink="/login" class="text-sm font-medium text-blue-600 hover:text-blue-700">
          Voltar para o login
        </a>

      </div>

    </div>

  </div>

</div>
