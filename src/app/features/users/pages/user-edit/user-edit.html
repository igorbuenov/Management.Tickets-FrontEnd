<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4 py-8">

  <div class="w-full max-w-md">

    <div class="rounded-xl bg-white p-8 shadow-lg">

      <!-- HEADER -->
      <div class="mb-8 text-center">

        <h1 class="text-2xl font-bold text-gray-900">
          Editar usuário
        </h1>

        <p class="mt-2 text-sm text-gray-600">
          Atualize os dados do usuário.
        </p>

      </div>

      <!-- MENSAGEM -->
      @if (message()) {
        <div
          class="mb-6 rounded-lg border p-4 text-sm"
          [class.border-red-200]="isError()"
          [class.bg-red-50]="isError()"
          [class.text-red-700]="isError()"
          [class.border-green-200]="!isError()"
          [class.bg-green-50]="!isError()"
          [class.text-green-700]="!isError()"
        >
          {{ message() }}
        </div>
      }

      <!-- LOADING -->
      @if (isLoading()) {

        <div class="py-8 text-center text-sm text-gray-500">
          Carregando dados do usuário...
        </div>

      } @else {

        <!-- FORM -->
        <form
          (ngSubmit)="updateUser()"
          class="space-y-5"
        >

          <!-- NOME -->
          <div>

            <label
              for="name"
              class="mb-2 block text-sm font-medium text-gray-700"
            >
              Nome
            </label>

            <input
              id="name"
              name="name"
              type="text"
              [(ngModel)]="name"
              placeholder="Digite o nome"
              class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />

          </div>

          <!-- EMAIL -->
          <div>

            <label
              for="email"
              class="mb-2 block text-sm font-medium text-gray-700"
            >
              Email
            </label>

            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              placeholder="Digite o email"
              class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />

          </div>

          <!-- BOTÕES -->
          <div class="flex gap-3 pt-2">

            <a
              routerLink="/users"
              class="flex-1 rounded-lg border border-gray-300 px-4 py-3 text-center text-sm font-semibold text-gray-700 transition hover:bg-gray-50"
            >
              Cancelar
            </a>

            <button
              type="submit"
              [disabled]="isLoading()"
              class="flex-1 rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-gray-400"
            >
              @if (isLoading()) {
                Salvando...
              } @else {
                Salvar alterações
              }
            </button>

          </div>

        </form>

      }

    </div>

  </div>

</div>
