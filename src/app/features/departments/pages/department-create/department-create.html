<div class="mx-auto max-w-3xl p-6">

  <div class="mx-auto mt-10 max-w-2xl">

    <div class="mb-6">
      <h1 class="text-2xl font-semibold text-gray-900">
        Criar departamento
      </h1>

      <p class="mt-1 text-sm text-gray-500">
        Preencha os dados para cadastrar um novo departamento.
      </p>
    </div>

    @if (message()) {
      <div
        class="mb-6 rounded-lg border px-4 py-3 text-sm font-medium"
        [class.border-green-200]="!isError()"
        [class.bg-green-50]="!isError()"
        [class.text-green-700]="!isError()"
        [class.border-red-200]="isError()"
        [class.bg-red-50]="isError()"
        [class.text-red-700]="isError()"
      >
        {{ message() }}
      </div>
    }

    <form
      [formGroup]="departmentForm"
      (ngSubmit)="submit()"
      class="space-y-6"
    >

      <div>
        <label
          for="name"
          class="mb-2 block text-sm font-medium text-gray-700"
        >
          Nome
        </label>

        <input
          id="name"
          type="text"
          formControlName="name"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          placeholder="Digite o nome do departamento"
        >

        @if (
          departmentForm.controls.name.invalid &&
          departmentForm.controls.name.touched
        ) {
          <p class="mt-1 text-sm text-red-600">
            Informe o nome do departamento.
          </p>
        }
      </div>

      <div class="flex justify-end gap-3">

        <button
          type="button"
          (click)="cancel()"
          class="rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50"
        >
          Cancelar
        </button>

        <button
          type="submit"
          [disabled]="isLoading()"
          class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ isLoading() ? 'Criando...' : 'Criar departamento' }}
        </button>

      </div>

    </form>

  </div>
</div>
